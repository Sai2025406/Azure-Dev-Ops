trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  VERCEL_ORG_ID: 'team_E74IuZoo0cdZy2PMNx7kftpv'
  VERCEL_PROJECT_ID: 'prj_f91KScFAzS2PqGvwBe2itMWQG9eZ'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node Environment'

- task: Bash@3
  displayName: 'Compile and Deploy Live to Vercel Production'
  inputs:
    targetType: 'inline'
    script: |
      # 1. Install Vercel CLI tool globally
      npm install -g vercel

      # 2. Hard-delete any lingering cache tracking files
      rm -rf .vercel

      # 3. Pull down framework configuration explicitly passing token + scope params
      echo "Pulling latest environment settings from Vercel..."
      vercel pull --yes --environment=production --token=$(VERCEL_TOKEN) --scope=sai-sidhant-mishra-s-projects --project=prj_f91KScFAzS2PqGvwBe2itMWQG9eZ
      
      # 4. Compile your web framework code bundles
      echo "Building production bundles..."
      vercel build --prod --token=$(VERCEL_TOKEN) --scope=sai-sidhant-mishra-s-projects --project=prj_f91KScFAzS2PqGvwBe2itMWQG9eZ
      
      # 5. Push the build directory directly live to production servers
      echo "Shipping application artifacts live to production infrastructure..."
      vercel deploy --prebuilt --prod --token=$(VERCEL_TOKEN) --scope=sai-sidhant-mishra-s-projects --project=prj_f91KScFAzS2PqGvwBe2itMWQG9eZ
