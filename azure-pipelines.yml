trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  VERCEL_ORG_ID: 'team_E74IuZoo0cdZy2PMNx7kftpv'
  VERCEL_PROJECT_ID: 'prj_f91KScFAzS2PqGvwBe2itMWQG9eZ'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node Environment'

- task: Bash@3
  displayName: 'Compile and Deploy Live to Vercel Production'
  inputs:
    targetType: 'inline'
    script: |
      # 1. Install Vercel CLI tool globally
      npm install -g vercel

      # 2. Delete any conflicting tracking artifacts
      rm -rf .vercel

      # 3. Pull down the exact workspace settings profile
      echo "Pulling latest environment settings from Vercel..."
      vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      # 4. Compile your framework application code locally on the build agent
      echo "Building production bundles..."
      vercel build --prod --token=$VERCEL_TOKEN

      # 5. Push the built build directory live to the internet
      echo "Shipping application artifacts live to production infrastructure..."
      vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
  env:
    # 🟢 Vercel CLI looks strictly for these exact native system environment keys
    VERCEL_TOKEN: $(VERCEL_TOKEN)
    VERCEL_ORG_ID: 'sai-sidhant-mishra-s-projects'
    VERCEL_PROJECT_ID: 'prj_f91KScFAzS2PqGvwBe2itMWQG9eZ'
