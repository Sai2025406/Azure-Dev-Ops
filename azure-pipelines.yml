trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  VERCEL_ORG_ID: 'team_E74IuZoo0cdZy2PMNx7kftpv'
  VERCEL_PROJECT_ID: 'prj_f91KScFAzS2PqGvwBe2itMWQG9eZ'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node Environment'

- task: Bash@3
  displayName: 'Extract Token & Deploy to Vercel'
  inputs:
    targetType: 'inline'
    script: |
      # 1. Install Vercel CLI tool globally
      npm install -g vercel

      # 2. Hard-delete any lingering cache tracking files
      rm -rf .vercel

      # 3. Explicitly execute pull and build using direct project tracking overrides
      echo "Initializing clean build configuration link..."
      vercel pull --yes --environment=production --token=$VERCEL_TOKEN --scope=team_E74IuZoo0cdZy2PMNx7kftpv
      
      echo "Building production bundles..."
      vercel build --prod --token=$VERCEL_TOKEN
      
      echo "Deploying live to Vercel production..."
      vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
  env:
    VERCEL_TOKEN: $(VERCEL_TOKEN)


