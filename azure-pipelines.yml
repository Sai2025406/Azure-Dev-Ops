trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  VERCEL_ORG_ID: 'team_E74IuZoo0cdZy2PMNx7kftpv'
  VERCEL_PROJECT_ID: 'prj_f91KScFAzS2PqGvwBe2itMWQG9eZ'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node Environment'

- task: Bash@3
  displayName: 'Direct Production Build and Deploy to Vercel'
  inputs:
    targetType: 'inline'
    script: |
      # 1. Install Vercel CLI tool globally
      npm install -g vercel

      # 2. Force remove all tracking directories to avoid validation loops
      rm -rf .vercel

      # 3. Direct source push execution bypassing local builds
      echo "Uploading workspace source directly to remote Vercel compilers..."
      vercel deploy --prod --yes --token=$(VERCEL_TOKEN)
