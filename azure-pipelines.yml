trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
# Step 1: Packages your HTML file so the extension can view it
- task: CopyFiles@2
  displayName: 'Stage HTML file'
  inputs:
    SourceFolder: '$(Build.SourcesDirectory)'
    Contents: 'index.html'
    TargetFolder: '$(Build.ArtifactStagingDirectory)'

# Step 2: Renders your live dashboard preview utilizing the correct extension identifier name
- task: PublishHtmlReport@1
  displayName: 'Display Live Website Preview'
  inputs:
    reportDir: '$(Build.ArtifactStagingDirectory)/index.html'
    tabName: 'Live Web View'
