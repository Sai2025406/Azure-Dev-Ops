trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  VERCEL_ORG_ID: 'team_E74IuZoo0cdZy2PMNx7kftpv'
  VERCEL_PROJECT_ID: 'prj_f91KScFAzS2PqGvwBe2itMWQG9eZ'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node Environment'

- task: Bash@3
  displayName: 'Compile and Deploy Live to Vercel Production'
  inputs:
    targetType: 'inline'
    script: |
      # 1. Install Vercel CLI engine globally
      npm install -g vercel

      # 2. Hard-clean workspace context tracking configuration directories
      rm -rf .vercel

      # 3. Direct compilation using injected environment properties
      echo "Executing local production project workspace compilation bundles..."
      vercel build --prod --token=$VERCEL_TOKEN
      
      # 4. Ship the compiled release directory straight to production servers
      echo "Shipping application artifacts live to production infrastructure..."
      vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
  env:
    # 🟢 Global environment mappings that the Vercel CLI reads natively
    VERCEL_TOKEN: $(VERCEL_TOKEN)
    VERCEL_ORG_ID: 'sai-sidhant-mishra-s-projects'
    VERCEL_PROJECT_ID: 'prj_f91KScFAzS2PqGvwBe2itMWQG9eZ'
